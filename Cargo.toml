[package]
name = "axum-best"
version = "0.1.0"
edition = "2024"
description = "For the optimal axum development experience"
authors = ["xx 2356450144@qq.com"]
keywords = [
  "Optimal Axum Development Experience",
  "Axum Development",
  "Rust Web Framework",
]
license = "MIT"
readme = "README.md"

[workspace]
members = ["crates/gitver", "crates/nextid", "crates/noworkers"]

[workspace.dependencies]
thiserror = { version = "2" }
tokio = { version = "1.47.1", features = ["rt", "sync", "time"] }
tracing = { version = "0.1.41" }

[dependencies]
tokio = { workspace = true, features = ["full"] }
async-trait = { version = "0.1" }
human-panic = { version = "2.0.3", features = ["color"] }
axum = { version = "0.8.6", features = ["default", "macros", "query"] }
clap = { version = "4.4.6", features = [
  "derive",
  "wrap_help",
  "env",
  "string",
  "default",
] }
toml = { version = "0.9.7", features = ["default"] }
anyhow = { version = "1.0.100", features = ["default"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["default"] }
jsonwebtoken = { version = "9.3.1" }
sea-orm = { version = "2.0.3", default-features = false, features = [
  "macros",
  "sqlx-mysql",
  "runtime-tokio-rustls",
] }
tracing = { workspace = true, features = ["attributes"] }
tracing-appender = { version = "0.2.3" }
tracing-subscriber = { version = "0.3.20", features = ["chrono", "json"] }
tracing-opentelemetry = { version = "0.25.0" }
opentelemetry = { version = "0.24.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.24.1", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.17.0", features = ["grpc-tonic", "trace"] }
smart-default = { version = "0.7.1" }
log = { version = "0.4.28", features = ["serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
axum-prometheus = { version = "0.10.1" }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
validator = { version = "0.20.0", features = ["derive"] }
lazy_static = { version = "1.5.0", features = ["spin"] }
derivative = { version = "2.1.3" }
tower-http = { version = "0.6.6", features = [
  "trace",
  "compression-full",
  "decompression-full",
  "cors",
  "limit",
  "timeout",
] }
tower = { version = "0.5.2", features = ["timeout", "tracing", "util"] }
governor = { version = "0.10" }
regex = { version = "1" }
redis = { version = "1.0", features = ["tokio-comp", "json", "bb8"] }
bb8 = { version = "0.9" }
redis-macros = { version = "1.0.1" }
rand = { version = "0.9.2" }
sha2 = { version = "0.10.9" }
sha1 = { version = "0.10.6" }
md-5 = { version = "0.10.6" }
digest = { version = "0.10.7" }
reqwest = { version = "0.12.23", default-features = false, features = [
  "json",
  "rustls-tls",
] }
local-ip-address = { version = "0.6.5" }
gitver = { path = "crates/gitver" }
noworkers = { path = "crates/noworkers" }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
manifest-dir-macros = { version = "0.1.18", features = ["default"] }

[[bench]]
name = "utils_benchmark"
harness = false

[[bench]]
name = "models_user"
harness = false

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false
strip = "none"

[profile.release]
# https://doc.rust-lang.org/cargo/reference/profiles.html
opt-level = 3
overflow-checks = true   #  integer overflow checks.
debug = false
debug-assertions = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
